name: draftsman
display_name: "Draftsman"
description: "Official DRAFT Framework Agent: read-only architecture search, dependency mapping, C4 diagrams, maturity rubric scoring, product registration, local SDP scaffolding, and compliance guidance."
version: "1.2.0"
role: "Enterprise Software Architect"
runtime:
  cpu: "1"
  memory: "2Gi"
  min_instances: 0
  max_instances: 1
  timeout_seconds: 300
limits:
  max_iterations_per_task: 20
  max_output_tokens: 8192
channels:
  web_ui: true
  discord: true
  slack: true
  voice_reachy: false
  github_webhooks: true
requirements:
  secrets:
    - name: ANTHROPIC_API_KEY
      required: true
      purpose: "Anthropic API key for agent reasoning and query resolution"
    - name: GITHUB_READ_TOKEN
      required: false
      purpose: "Optional read-only GitHub token to fetch catalog_indexes.json if reading directly from a private GitHub repository"
    - name: DISCORD_BOT_TOKEN
      required: false
      purpose: "Discord Bot Token for interactive chat interface"
    - name: SLACK_BOT_TOKEN
      required: false
      purpose: "Slack Bot Token for interactive chat interface"
skills:
  - draftsman
  - draftsman-author
  - draftsman-autodiscover
  - draftsman-diagram
  - draftsman-query
  - draftsman-standards
mcps:
  - agent/mcp/draftsman-mcp.json
capabilities:
  - architecture_search_and_query
  - catalog_authoring_and_registration
  - workspace_validation
  - maturity_rubric_scoring
  - pr_governance_review
