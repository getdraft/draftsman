name: Generate Derived Assets

on:
  push:
    branches:
      - main
    paths:
      - "**/*.yaml"
      - "framework/docs/**"
      - "framework/browser/**"
      - "templates/**"
      - "framework/tools/generate_ai_index.py"
      - "framework/tools/generate_browser.py"
      - "framework/tools/generate_diagram.py"
      - "framework/tools/generate_indexes.py"
      - "framework/tools/indexes.py"
      - "AGENTS.md"
      - "README.md"
      - "llms.txt"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install pyyaml

      - name: Generate indexes
        run: python framework/tools/generate_indexes.py

      - name: Generate browser
        run: python framework/tools/generate_browser.py --refresh-shell

      - name: Generate AI index
        run: python framework/tools/generate_ai_index.py

      - name: Commit generated assets to an update branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/assets docs/user-manual.html docs/diagrams AI_INDEX.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # main is protected (pull requests only, "validate" required), so the regenerated
          # assets go to a branch and a pull request instead of a direct push.
          git checkout -B chore/derived-assets
          git commit -m "chore: regenerate derived catalog assets"
          git push --force-with-lease origin chore/derived-assets
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --head chore/derived-assets --base main --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head chore/derived-assets \
              --title "chore: regenerate derived catalog assets" \
              --body "Browser, diagram pages and AI index regenerated from main by the Generate Derived Assets workflow. Merge when the validate check is green."
          else
            echo "Pull request #$existing updated by the force-push."
          fi
