schemaVersion: '1.0'
type: listener
requiredFields:
- schemaVersion
- uid
- type
- name
- owner
- protocol
- port
- endpoint
- authenticationModel
- catalogStatus
optionalFields:
- methods
- description
enumFields:
  catalogStatus:
  - stub
  - incomplete
  - complete
  protocol:
  - REST
  - gRPC
  - GraphQL
  - WebSocket
  - AMQP
  - SMTP
  - SQL
  - Redis
  - Kafka
  - SQS
  - SNS
  - S3
  - DynamoDB
  - HTTPS
  - other
  authenticationModel:
  - iam
  - api-key
  - oauth
  - saml
  - none
  - other
  - TBD
fieldTypes:
  name: str
  owner: dict
  protocol: str
  port: int
  endpoint: str
  authenticationModel: str
  methods: list
  description: str
dictSubSchemas:
  owner: listenerOwner
listenerOwner:
  requiredFields:
  - ref
  - kind
  enumFields:
    kind:
    - product_component
    - data_component
    - external_system
  fieldTypes:
    ref: str
    kind: str
  fieldDescriptions:
    ref: UID of the component, data component or external system that owns this listener.
    kind: Use product_component, data_component or external_system to match the owner object type.
uidPattern: ^[0-9A-HJKMNP-TV-Z]{10}-[0-9A-HJKMNP-TV-Z]{4}$
aiHint: >
  A Listener is a first-class, UID-addressable network endpoint owned by a component, data component or external system.
  Record the protocol, port, endpoint and authenticationModel here. Use none only when no authentication applies; a committed DecisionRecord should justify it (not yet enforced by validation).
  Use catalogStatus stub for an endpoint known only by name, incomplete when fields are partly known, and complete when fully authored.
fieldDescriptions:
  schemaVersion: Use the schema version string supported by this framework release, normally "1.0".
  uid: Use the generated opaque UID for object identity. Do not edit it for display-name changes.
  type: Use listener exactly.
  name: Use a clear human-readable name for this listener.
  owner: Declare the object that owns this listener as a ref and kind.
  protocol: Use one of the approved protocol values.
  port: Record the TCP or UDP port number the listener is reachable on (1-65535).
  endpoint: Record the endpoint or address path for the listener, such as a route, topic or queue name.
  authenticationModel: Use the authentication model that applies to this listener. none should be justified by a committed DecisionRecord (not yet enforced by validation).
  methods: Optional list of operations or methods exposed by this listener, such as GET or Publish.
  description: Describe the purpose or consumer-facing behavior of this listener.
  catalogStatus: Use stub, incomplete, or complete to describe catalog maturity.
