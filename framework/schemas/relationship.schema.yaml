schemaVersion: '1.0'
type: relationship
defaultOwnerRole: shared-services
requiredFields:
- schemaVersion
- uid
- type
- name
- source
- label
- catalogStatus
optionalFields:
- description
- target
- externalTarget
- targetInterface
- targetListener
- technology
- direction
- flow
- capabilities
- notes
- tags
conditionalRequired:
- when:
    externalTarget: null
  require:
  - target
enumFields:
  catalogStatus:
  - stub
  - incomplete
  - complete
  direction:
  - synchronous
  - asynchronous
  - event
  flow:
  - outbound
  - inbound
  - bidirectional
fieldTypes:
  targetInterface: str
  targetListener: str
  tags: list
  capabilities: list
uidPattern: ^[0-9A-HJKMNP-TV-Z]{10}-[0-9A-HJKMNP-TV-Z]{4}$
aiHint: >
  A Relationship records a directed inter-object communication edge — the structured replacement for externalInteractions.
  A relationship is always a call from caller to listener: source is the caller, target is the object that owns the listener, and targetListener names the listener.
  Use source and target for catalog UIDs. externalTarget (free string) is deprecated: model the external party as a system object, give it a listener, and set target and targetListener; existing externalTarget values still load, validate and render.
  The direction field captures the communication pattern (synchronous/asynchronous/event). flow is deprecated except for its default, outbound: flow inbound and flow bidirectional still load, validate and render, but a response is already covered by direction synchronous and an inbound caller is recorded by making it the source. Removal is deferred to a later major version. Ratcheted rules relationship-flow-deprecated, relationship-external-target-freetext and relationship-source-is-listener-side report these values on new or edited relationships; existing ones are baselined.
  Use capabilities to list capability UIDs that this relationship enables or satisfies.
  Record a flow on the component or instance that makes the call, never on a service definition: a service definition (an object under the shared-services catalog folder, or serviceRole: definition) is consumed through substrate and runsOn and carries no flows, so it is never a source or target. The ratcheted rule relationship-definition-endpoint is enforced and reports a relationship whose source or target is a definition (paths.serviceDefinitionsFolder in workspace.yaml overrides the definitions folder). An external service that lives in the definitions folder takes serviceRole: instance so it can be an endpoint. An external service (identity provider, secrets manager, SaaS) is a legitimate target: use its catalog UID or externalTarget, and it is drawn as an External interaction.
fieldDescriptions:
  schemaVersion: Use the schema version string supported by this framework release, normally "1.0".
  uid: Use the generated opaque UID for object identity. Do not edit it for display-name changes.
  type: Use relationship exactly.
  name: Use a short human-readable name describing this relationship (e.g. "Auth Service → User DB").
  source: UID of the catalog object initiating the relationship (the caller or producer).
  target: UID of the catalog object receiving the relationship (the callee or consumer). Required when externalTarget is not set.
  externalTarget: Deprecated. Free-text name of an external system with no catalog object (e.g. "LDAP Directory"). Still accepted, but one system gets many spellings and its listeners collapse into one name; record the external party as a system object with listeners and set target and targetListener instead.
  targetInterface: >
    Name of the target's interface this relationship enters through: an entry of the target's interfaces, or data
    for a data component without an interfaces list. Rule relationship-target-interface reports an error when the
    target is a product_component and this is missing or names no interface of the target (ratcheted: existing
    relationships are baselined). A value on a target that has no interfaces list is a warning. Never a port or host.
  targetListener: UID of the listener object this relationship calls, the exact endpoint on the target. Every relationship names one, including data and external targets. For a catalog target the listener must be owned by that target; for an externalTarget any listener UID serves. Rule relationship-target-listener is ratcheted.
  label: Short verb phrase describing the interaction — e.g. "calls", "reads from", "writes to", "sends events to".
  technology: Protocol or technology used — e.g. "HTTPS", "gRPC", "AMQP", "PostgreSQL wire protocol".
  direction: Communication pattern — synchronous for request/response, asynchronous for fire-and-forget, event for event-driven.
  flow: Deprecated except for outbound, the default. A relationship is always caller (source) to listener, so omit flow or use outbound. inbound (swap source and target so the caller is the source) and bidirectional (a request/response is direction synchronous) are deprecated but still accepted.
  capabilities: List of capability UIDs that this relationship enables or satisfies.
  catalogStatus: Use stub, incomplete, or complete to describe catalog maturity, not company adoption disposition.
  notes: Any additional context about why this relationship exists or how it is governed.
