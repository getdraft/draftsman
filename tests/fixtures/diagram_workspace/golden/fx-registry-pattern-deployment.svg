<style>:root{--surface:#ffffff;--ink:#1a2230;--muted:#586374;--line:#7a8696;--box:#ffffff;--box-line:#555555;--band:#f3f5f8;--band-line:#c3cad4;--lane:#fbf6ec;--lane-line:#d8c9a8;--target:#eef1f6;--target-line:#9aa6b6;--group:#f8f9fb;--group-line:#7a8696;--zone-line:#c3cad4;--amber:#a85a00;--chip-component:#dbeafe;--chip-data:#dcfce7;--chip-data-store:#ccfbf1;--chip-runtime:#ede9fe;--chip-network:#fef3c7;--chip-ai-gateway:#fce7f3;--chip-host:#e5e7eb;--chip-external:#f1f5f9;--chip-other:#f5f5f4;--chip-ink:#1a2230;}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#18202b;--ink:#e4e9f0;--muted:#97a2b3;--line:#8c99ab;--box:#18202b;--box-line:#8c99ab;--band:#121923;--band-line:#3c485a;--lane:#221d12;--lane-line:#6b5d3f;--target:#121923;--target-line:#3c485a;--group:#141b25;--group-line:#4a586b;--zone-line:#3c485a;--amber:#f2a64e;--chip-component:#1e3a5f;--chip-data:#14532d;--chip-data-store:#134e4a;--chip-runtime:#4c1d95;--chip-network:#713f12;--chip-ai-gateway:#831843;--chip-host:#374151;--chip-external:#0f172a;--chip-other:#292524;--chip-ink:#e4e9f0;}}:root[data-theme="dark"]{--surface:#18202b;--ink:#e4e9f0;--muted:#97a2b3;--line:#8c99ab;--box:#18202b;--box-line:#8c99ab;--band:#121923;--band-line:#3c485a;--lane:#221d12;--lane-line:#6b5d3f;--target:#121923;--target-line:#3c485a;--group:#141b25;--group-line:#4a586b;--zone-line:#3c485a;--amber:#f2a64e;--chip-component:#1e3a5f;--chip-data:#14532d;--chip-data-store:#134e4a;--chip-runtime:#4c1d95;--chip-network:#713f12;--chip-ai-gateway:#831843;--chip-host:#374151;--chip-external:#0f172a;--chip-other:#292524;--chip-ink:#e4e9f0;}.band{fill:var(--band,#f3f5f8);stroke:var(--band-line,#c3cad4)}.lane{fill:var(--lane,#fbf6ec);stroke:var(--lane-line,#d8c9a8);stroke-dasharray:6 4}.bl,.ll{font:600 11px sans-serif;fill:var(--muted,#586374)}.tgt{fill:var(--target,#eef1f6);stroke:var(--target-line,#9aa6b6);stroke-width:1.4}.grp{fill:var(--group,#f8f9fb);stroke:var(--group-line,#7a8696)}.store>.grp{fill:var(--band,#f3f5f8);stroke:var(--band-line,#c3cad4)}.zl{fill:var(--surface,#ffffff);stroke:var(--zone-line,#c3cad4);stroke-dasharray:3 3}.tl{font:700 12px sans-serif;fill:var(--ink,#1a2230)}.gl,.zc{font:600 11px sans-serif;fill:var(--muted,#586374)}.gc{font:600 12px sans-serif;fill:var(--ink,#1a2230)}.box{fill:var(--box,#ffffff);stroke:var(--box-line,#555555);stroke-width:1.4}.ttl{font:600 12px sans-serif;fill:var(--ink,#1a2230)}.cap{font:10px sans-serif;fill:var(--muted,#586374)}.dashed .box,.group.dashed .grp{stroke-dasharray:5 3}.ret .box{stroke-dasharray:5 3;opacity:.6}.dep .box{stroke:var(--amber,#a85a00)}.ret .grp{stroke-dasharray:5 3;opacity:.6}.dep .grp{stroke:var(--amber,#a85a00)}.chip-component{fill:var(--chip-component,#dbeafe)}.chip-data{fill:var(--chip-data,#dcfce7)}.chip-data-store{fill:var(--chip-data-store,#ccfbf1)}.chip-runtime{fill:var(--chip-runtime,#ede9fe)}.chip-network{fill:var(--chip-network,#fef3c7)}.chip-ai-gateway{fill:var(--chip-ai-gateway,#fce7f3)}.chip-host{fill:var(--chip-host,#e5e7eb)}.chip-external{fill:var(--chip-external,#f1f5f9)}.chip-other{fill:var(--chip-other,#f5f5f4)}.chip-t{font:600 9px sans-serif;fill:var(--chip-ink,#1a2230)}.tech-line{font:9px sans-serif;fill:var(--muted,#586374)}.ln{fill:none;stroke:var(--line,#7a8696);stroke-width:1.4}.ln.dashed{stroke-dasharray:6 4}.ln.dotted{stroke-dasharray:1 3;stroke-linecap:round;stroke-width:1.8}.fl{display:none;fill:none;stroke:var(--surface,#ffffff);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 8;animation:flow .9s linear infinite}.fl.rev{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-10}}@media (prefers-reduced-motion:reduce){.fl{animation:none}}.mk{fill:var(--line,#7a8696)}.lb{font:600 10.5px sans-serif;fill:var(--muted,#586374);paint-order:stroke;stroke:var(--surface,#ffffff);stroke-width:3px;stroke-linejoin:round}.lb .tech{font-weight:400}.lb{display:none}.edge.on.out .lb-t,.edge.on.in .lb-s{display:inline}.callout{display:none;font:600 11px sans-serif;fill:var(--ink,#1a2230);paint-order:stroke;stroke:var(--surface,#ffffff);stroke-width:4px;stroke-linejoin:round;pointer-events:none}.callout .tech{font-weight:400}.edge:hover .callout{display:inline}</style>
