band,#f3f5f8);stroke:var(--band-line,#c3cad4)}.zl{fill:var(--surface,#ffffff);stroke:var(--zone-line,#c3cad4);stroke-dasharray:3 3}.tl{font:700 12px sans-serif;fill:var(--ink,#1a2230)}.gl,.zc{font:600 11px sans-serif;fill:var(--muted,#586374)}.gc{font:600 12px sans-serif;fill:var(--ink,#1a2230)}.box{fill:var(--box,#ffffff);stroke:var(--box-line,#555555);stroke-width:1.4}.ttl{font:600 12px sans-serif;fill:var(--ink,#1a2230)}.cap{font:10px sans-serif;fill:var(--muted,#586374)}.dashed .box,.group.dashed .grp{stroke-dasharray:5 3}.ret .box{stroke-dasharray:5 3;opacity:.6}.dep .box{stroke:var(--amber,#a85a00)}.ret .grp{stroke-dasharray:5 3;opacity:.6}.dep .grp{stroke:var(--amber,#a85a00)}.chip-component{fill:var(--chip-component,#dbeafe)}.chip-data{fill:var(--chip-data,#dcfce7)}.chip-data-store{fill:var(--chip-data-store,#ccfbf1)}.chip-runtime{fill:var(--chip-runtime,#ede9fe)}.chip-network{fill:var(--chip-network,#fef3c7)}.chip-ai-gateway{fill:var(--chip-ai-gateway,#fce7f3)}.chip-host{fill:var(--chip-host,#e5e7eb)}.chip-external{fill:var(--chip-external,#f1f5f9)}.chip-other{fill:var(--chip-other,#f5f5f4)}.chip-t{font:600 9px sans-serif;fill:var(--chip-ink,#1a2230)}.tech-line{font:9px sans-serif;fill:var(--muted,#586374)}.ln{fill:none;stroke:var(--line,#7a8696);stroke-width:1.4}.ln.dashed{stroke-dasharray:6 4}.ln.dotted{stroke-dasharray:1 3;stroke-linecap:round;stroke-width:1.8}.fl{display:none;fill:none;stroke:var(--surface,#ffffff);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 8;animation:flow .9s linear infinite}.fl.rev{animation-direction:reverse}@keyframes flow{to{stroke-dashoffset:-10}}@media (prefers-reduced-motion:reduce){.fl{animation:none}}.mk{fill:var(--line,#7a8696)}.lb{font:600 10.5px sans-serif;fill:var(--muted,#586374);paint-order:stroke;stroke:var(--surface,#ffffff);stroke-width:3px;stroke-linejoin:round}.lb .tech{font-weight:400}.lb{display:none}.edge.on.out .lb-t,.edge.on.in .lb-s{display:inline}.callout{display:none;font:600 11px sans-serif;f